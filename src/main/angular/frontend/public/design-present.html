<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Brycen Design — Present</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=Inter:wght@400;500;600&family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;600&family=Lato:wght@400;700&family=Poppins:wght@400;500;600&family=Nunito:wght@400;600&family=Montserrat:wght@400;600;700&family=Raleway:wght@400;600&family=Playfair+Display:wght@400;700&family=Merriweather:wght@400;700&family=Source+Code+Pro:wght@400;500&family=Fira+Code:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap');

    :root {
      --bg0: #0c0c0e;
      --bg1: #131315;
      --bg2: #1a1a1d;
      --bg3: #222226;
      --bg4: #2a2a2f;
      --brd: #2e2e33;
      --brdL: #3a3a40;
      --acc: #6c63ff;
      --acc2: #00d4a8;
      --acc3: #ff6b6b;
      --t0: #f0f0f2;
      --t1: #9a9aa8;
      --t2: #5a5a65;
      --sel: rgba(108, 99, 255, .18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: var(--bg0);
      color: var(--t0);
      user-select: none;
    }

    /* Allow scroll inside panels */
    .dscroll, .ps, #lt-comp, #lt-layers {
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* ── TOP BAR ── */
    #TB {
      height: 46px;
      background: var(--bg1);
      border-bottom: 1px solid var(--brd);
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 6px;
      flex-shrink: 0;
      z-index: 100;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 15px;
      background: linear-gradient(135deg, var(--acc), var(--acc2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-right: 2px;
    }

    .sep {
      width: 1px;
      height: 22px;
      background: var(--brd);
      margin: 0 2px;
    }

    .sp {
      flex: 1;
    }

    /* mode tabs */
    .mtabs {
      display: flex;
      background: var(--bg3);
      border-radius: 7px;
      padding: 2px;
      gap: 2px;
    }

    .mt {
      padding: 4px 12px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      color: var(--t1);
      border: none;
      background: none;
      font-family: 'Inter', sans-serif;
    }

    .mt:hover {
      color: var(--t0);
      background: var(--bg4);
    }

    .mt.on {
      background: var(--acc);
      color: #fff;
    }

    .mt.dev.on {
      background: var(--acc2);
      color: #000;
    }

    .mt.pre.on {
      background: var(--acc3);
      color: #fff;
    }

    /* zoom */
    .zc {
      display: flex;
      align-items: center;
      background: var(--bg3);
      border-radius: 6px;
      padding: 2px 5px;
      gap: 1px;
    }

    .zb {
      width: 22px;
      height: 22px;
      border: none;
      background: none;
      color: var(--t1);
      cursor: pointer;
      font-size: 14px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .zb:hover {
      background: var(--bg4);
      color: var(--t0);
    }

    .zv {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--t1);
      min-width: 40px;
      text-align: center;
    }

    /* buttons */
    .btn {
      padding: 5px 13px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      font-family: 'Inter', sans-serif;
    }

    .bpri {
      background: var(--acc);
      color: #fff;
    }

    .bpri:hover {
      background: #7c74ff;
    }

    .bgh {
      background: var(--bg3);
      color: var(--t1);
      border: 1px solid var(--brd);
    }

    .bgh:hover {
      color: var(--t0);
      background: var(--bg4);
    }

    .bgreen {
      background: rgba(0, 212, 168, .15);
      color: var(--acc2);
      border: 1px solid rgba(0, 212, 168, .3);
    }

    .bgreen:hover {
      background: rgba(0, 212, 168, .25);
    }

    /* ── MAIN ── */
    #MAIN {
      display: flex;
      flex: 1;
      overflow: hidden;
      min-height: 0;
      position: relative;
    }

    /* ── LEFT PANEL ── */
    #LP {
      width: 248px;
      background: var(--bg1);
      border-right: 1px solid var(--brd);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 20;
      overflow: hidden;
      position: relative;
    }

    .ptabs {
      display: flex;
      border-bottom: 1px solid var(--brd);
    }

    .ptab {
      flex: 1;
      padding: 9px 4px;
      font-size: 10px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      color: var(--t2);
      border-bottom: 2px solid transparent;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .ptab:hover {
      color: var(--t1);
    }

    .ptab.on {
      color: var(--acc);
      border-bottom-color: var(--acc);
    }

    .ps {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .ps::-webkit-scrollbar {
      width: 3px;
    }

    .ps::-webkit-scrollbar-thumb {
      background: var(--brd);
      border-radius: 2px;
    }

    /* component grid */
    .cs {
      margin-bottom: 12px;
    }

    .csl {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--t2);
      padding: 3px 3px 6px;
    }

    .cg {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 3px;
    }

    .ci {
      background: var(--bg3);
      border: 1px solid var(--brd);
      border-radius: 7px;
      padding: 8px 5px;
      cursor: grab;
      text-align: center;
      transition: border-color .1s, background .1s;
    }

    .ci:hover {
      background: var(--bg4);
      border-color: var(--acc);
    }

    .ci:active {
      cursor: grabbing;
    }

    .ci-ico {
      font-size: 15px;
      display: block;
      margin-bottom: 3px;
      line-height: 1;
    }

    .ci-nm {
      font-size: 10px;
      color: var(--t1);
      font-weight: 500;
      line-height: 1;
    }

    /* layers */
    .lgrp {
      margin-bottom: 6px;
    }

    .lgrph {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 6px;
      font-size: 10px;
      font-weight: 700;
      color: var(--t1);
      text-transform: uppercase;
      letter-spacing: .7px;
      cursor: pointer;
      border-radius: 5px;
    }

    .lgrph .ldel {
      opacity: 0;
      margin-left: auto;
      color: var(--acc3);
      font-size: 11px;
      padding: 1px 5px;
      border-radius: 3px;
    }

    .lgrp:hover .ldel {
      opacity: 1;
    }

    .lgrph .ldel:hover {
      background: rgba(255, 107, 107, .15);
    }

    .lgrph:hover {
      background: var(--bg3);
      color: var(--t0);
    }

    .lgrph .cnt {
      color: var(--t2);
      font-size: 9px;
      margin-left: 3px;
      font-weight: 400;
    }

    .li {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 6px 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 1px;
      position: relative;
      user-select: none;
    }
    .li:hover { background: var(--bg3); }
    .li:hover .li-vis { opacity: 1; }
    .li.on { background: rgba(108,99,255,.18); }
    .li.on .li-nm { color: var(--acc); }
    .li.hid { opacity: .35; }
    .li.layer-dragging { opacity: .3; }
    .li.layer-over {
      background: rgba(22,163,74,.12);
      outline: 1.5px solid rgba(22,163,74,.5);
    }
    .li.layer-over-before::before {
      content: '';
      position: absolute;
      left: 0; right: 0; top: -1px;
      height: 2px;
      background: #16a34a;
      border-radius: 2px;
    }
    .li.layer-over-after::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: -1px;
      height: 2px;
      background: #16a34a;
      border-radius: 2px;
    }
    /* Tree indent lines */
    .li-indent {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }
    .li-line {
      width: 16px;
      height: 100%;
      position: relative;
      flex-shrink: 0;
    }
    .li-line::before {
      content: '';
      position: absolute;
      left: 8px;
      top: -50%;
      bottom: 50%;
      width: 1px;
      background: var(--brd);
    }
    .li-line::after {
      content: '';
      position: absolute;
      left: 8px;
      top: 50%;
      width: 8px;
      height: 1px;
      background: var(--brd);
    }
    .li-toggle {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      color: var(--t2);
      cursor: pointer;
      flex-shrink: 0;
      transition: background .1s;
    }
    .li-toggle:hover { background: var(--bg4); color: var(--t0); }

    .li-ico {
      font-size: 11px;
      flex-shrink: 0;
      width: 14px;
      text-align: center;
    }

    .li-nm {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 11px;
    }

    .li-vis {
      opacity: 0;
      font-size: 10px;
      cursor: pointer;
      color: var(--t2);
    }

    .li:hover .li-vis {
      opacity: 1;
    }

    .lempty {
      padding: 3px 18px;
      font-size: 10px;
      color: var(--t2);
    }

    /* ── CANVAS ── */
    #CA {
      flex: 1;
      position: relative;
      overflow: hidden;
      margin-right: 272px;
      background-color: var(--bg2);
      background-image: radial-gradient(circle, var(--brd) 1px, transparent 1px);
      background-size: 20px 20px;
      cursor: default;
      min-width: 0;
      max-width: 100%;
    }

    #CT {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    /* design frames */
    .df {
      position: absolute;
      background: #fff;
      box-shadow: 0 4px 40px rgba(0, 0, 0, .5);
    }
    .df.grid-on {
      background-image:
        linear-gradient(rgba(99,102,241,.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,.12) 1px, transparent 1px) !important;
      background-size: 10px 10px !important;
      background-color: #fff !important;
    }
    .df-center-h {
      position: absolute;
      left: 0; right: 0;
      top: 50%;
      height: 1px;
      background: rgba(108,99,255,.6);
      pointer-events: none;
      z-index: 5;
    }
    .df-center-v {
      position: absolute;
      top: 0; bottom: 0;
      left: 50%;
      width: 1px;
      background: rgba(108,99,255,.6);
      pointer-events: none;
      z-index: 5;
    }

    .df-lbl {
      position: absolute;
      top: -32px;
      left: 0;
      font-size: 20px;
      font-weight: 700;
      color: var(--t0);
      font-family: 'Inter', sans-serif;
      white-space: nowrap;
      pointer-events: auto;
      cursor: default;
      line-height: 1;
    }

    .df.active-frame {
      outline: 2px solid rgba(108, 99, 255, .6);
    }

    /* frame action bar shown on hover */
    .df-bar {
      position: absolute;
      top: -58px;
      left: 0;
      display: flex;
      align-items: center;
      gap: 4px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s;
    }

    .df:hover .df-bar,
    .df.active-frame .df-bar {
      opacity: 1;
      pointer-events: all;
    }

    .df-btn {
      background: var(--bg2);
      border: 1px solid var(--brdL);
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      color: var(--t1);
      font-family: Inter, sans-serif;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .df-btn:hover {
      background: var(--bg4);
      color: var(--t0);
    }

    .df-btn.del {
      color: var(--acc3);
      border-color: rgba(255, 107, 107, .3);
      background: rgba(255, 107, 107, .07);
    }

    .df-btn.del:hover {
      background: rgba(255, 107, 107, .18);
    }

    /* canvas comp */
    .cc {
      position: absolute;
      cursor: move;
    }

    .cc .inner {
      position: absolute;
      inset: 0;
      overflow: visible;
      pointer-events: none;
    }

    .cc-children {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .cc-children > .cc {
      pointer-events: all;
    }

    .cc:hover .inner {
      outline: none;
    }

    .cc.sel .inner {
      outline: 2px solid var(--acc) !important;
    }

    .cc.sel .rh {
      display: block !important;
    }

    /* resize handles */
    .rh {
      display: none !important;
      position: absolute;
      width: 7px;
      height: 7px;
      background: #fff;
      border: 1.5px solid var(--acc);
      border-radius: 1.5px;
      z-index: 20;
    }

    .rh-tl {
      top: -4px;
      left: -4px;
      cursor: nw-resize;
    }

    .rh-tr {
      top: -4px;
      right: -4px;
      cursor: ne-resize;
    }

    .rh-bl {
      bottom: -4px;
      left: -4px;
      cursor: sw-resize;
    }

    .rh-br {
      bottom: -4px;
      right: -4px;
      cursor: se-resize;
    }

    .rh-tc {
      top: -4px;
      left: calc(50% - 3.5px);
      cursor: n-resize;
    }

    .rh-bc {
      bottom: -4px;
      left: calc(50% - 3.5px);
      cursor: s-resize;
    }

    .rh-ml {
      left: -4px;
      top: calc(50% - 3.5px);
      cursor: w-resize;
    }

    .rh-mr {
      right: -4px;
      top: calc(50% - 3.5px);
      cursor: e-resize;
    }

    /* hover tooltip */
    #TT {
      position: absolute;
      pointer-events: none;
      z-index: 9999;
      background: var(--bg0);
      border: 1px solid var(--brdL);
      border-radius: 7px;
      padding: 7px 11px;
      min-width: 130px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, .5);
      display: none;
    }

    .tt-n {
      font-weight: 700;
      color: var(--t0);
      font-family: 'Syne', sans-serif;
      font-size: 12px;
      margin-bottom: 2px;
    }

    .tt-d {
      color: var(--t2);
      font-size: 9.5px;
      margin-bottom: 4px;
      line-height: 1.4;
    }

    .tt-m {
      font-family: 'DM Mono', monospace;
      color: var(--acc2);
      font-size: 9.5px;
    }

    /* marquee */
    #MQ {
      position: absolute;
      border: 1px solid var(--acc);
      background: rgba(108, 99, 255, .07);
      pointer-events: none;
      display: none;
      z-index: 50;
    }

    /* while dragging from library, let drag events pass through .cc to hit the frame */
    body.lib-dragging .cc {
      pointer-events: none !important;
    }

    body.lib-dragging .df {
      cursor: copy;
    }

    /* ── RIGHT PANEL ── */
    #RP {
      width: 272px;
      background: var(--bg1);
      border-left: 1px solid var(--brd);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 20;
      overflow: hidden;
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
    }

    .insp-pane {
      display: none;
      flex-direction: column;
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .insp-pane.on { display: flex; }
    .insp-pane::-webkit-scrollbar { width: 3px; }
    .insp-pane::-webkit-scrollbar-thumb { background: var(--brd); border-radius: 2px; }

    .rh-top {
      padding: 11px 14px 10px;
      border-bottom: 1px solid var(--brd);
      flex-shrink: 0;
    }

    .rh-name {
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .rh-sub {
      font-size: 10px;
      color: var(--t2);
      margin-top: 2px;
      font-family: 'DM Mono', monospace;
    }

    .rscroll {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
    }

    .rscroll::-webkit-scrollbar {
      width: 3px;
    }

    .rscroll::-webkit-scrollbar-thumb {
      background: var(--brd);
      border-radius: 2px;
    }

    /* prop sections */
    .rsec {
      margin-bottom: 15px;
    }

    .rsl {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      color: var(--t2);
      margin-bottom: 8px;
      padding-left: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .rsl::after {
      content: none;
    }

    .g2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 6px;
      width: 100%;
      box-sizing: border-box;
    }

    .ilab {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .ilab label {
      font-size: 9px;
      color: var(--t2);
      text-transform: uppercase;
    }

    .pi {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--brd);
      border-radius: 5px;
      padding: 4px 7px;
      font-size: 11px;
      color: var(--t0);
      font-family: 'DM Mono', monospace;
      outline: none;
    }

    .pi:focus {
      border-color: var(--acc);
      background: var(--bg2);
    }

    .prow {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 5px;
    }

    .plbl {
      font-size: 11px;
      color: var(--t1);
      width: 56px;
      flex-shrink: 0;
    }

    .pi-sm {
      width: 50px;
      flex: none;
    }

    .psel {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--brd);
      border-radius: 5px;
      padding: 4px 7px;
      font-size: 11px;
      color: var(--t0);
      outline: none;
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%235a5a65' stroke-width='1.5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 6px center;
    }

    /* color row */
    .crow {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 5px;
    }

    .csw {
      width: 26px;
      height: 26px;
      border-radius: 5px;
      border: 1px solid var(--brd);
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
    }

    .chex {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--brd);
      border-radius: 5px;
      padding: 4px 7px;
      font-size: 11px;
      color: var(--t0);
      font-family: 'DM Mono', monospace;
      outline: none;
    }

    .chex:focus {
      border-color: var(--acc);
    }

    .cop {
      width: 42px;
      background: var(--bg3);
      border: 1px solid var(--brd);
      border-radius: 5px;
      padding: 4px 5px;
      font-size: 11px;
      color: var(--t0);
      font-family: 'DM Mono', monospace;
      outline: none;
    }

    /* action btns */
    .actrow {
      display: flex;
      gap: 5px;
    }

    .abt {
      flex: 1;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      font-family: 'Inter', sans-serif;
    }

    .abt-dup {
      background: var(--bg3);
      color: var(--t1);
      border: 1px solid var(--brd);
    }

    .abt-dup:hover {
      color: var(--t0);
    }

    .abt-del {
      background: rgba(255, 107, 107, .1);
      color: var(--acc3);
      border: 1px solid rgba(255, 107, 107, .2);
    }

    .abt-del:hover {
      background: rgba(255, 107, 107, .2);
    }

    /* dev panel */
    #DP {
      display: none;
      flex-direction: column;
      flex: 1;
      overflow: hidden;

      // ══ CONTROLS ═════════════════════════════════════════════
      button: {
        n: 'Button', d: 'Interactive button', dw: 140, dh: 44, txt: true,
        r: c => `<button style="width:100%;height:100%;background:${gs(c,'backgroundColor','#16a34a')};color:${gs(c,'color','#fff')};border-radius:${gs(c,'borderRadius','8px')};font-size:${gs(c,'fontSize','14px')};font-weight:${gs(c,'fontWeight','600')};border:${gs(c,'borderWidth','0px')} solid ${gs(c,'borderColor','transparent')};cursor:pointer;font-family:'${gs(c,'fontFamily','Inter')}',sans-serif;box-shadow:${gs(c,'boxShadow','none')};text-align:${gs(c,'textAlign','center')}">${c.props.content||'Button'}</button>`
      },
      input: {
        n: 'Input', d: 'Text input field', dw: 220, dh: 44, txt: true,
        r: c => `<input type="text" placeholder="${c.props.content||'Enter text...'}" style="width:100%;height:100%;border:${gs(c,'borderWidth','1px')} solid ${gs(c,'borderColor','#ddd')};border-radius:${gs(c,'borderRadius','8px')};padding:0 14px;font-size:${gs(c,'fontSize','14px')};font-family:Inter,sans-serif;background:${gs(c,'backgroundColor','#fff')};color:#333;outline:none;box-sizing:border-box;">`
      },
      dropdown: {
        n: 'Dropdown', d: 'Select menu', dw: 180, dh: 44, txt: false,
        r: c => `<select style="width:100%;height:100%;border:1px solid ${gs(c,'borderColor','#ddd')};border-radius:${gs(c,'borderRadius','8px')};padding:0 12px;font-size:14px;font-family:Inter,sans-serif;background:${gs(c,'backgroundColor','#fff')};color:#333;box-sizing:border-box;"><option>Select option</option><option>Option A</option><option>Option B</option></select>`
      },
      checkbox: {
        n: 'Checkbox', d: 'Boolean checkbox', dw: 160, dh: 24, txt: true,
        r: c => `<label style="display:flex;align-items:center;gap:8px;font-size:${gs(c,'fontSize','13px')};color:${gs(c,'color','#333')};cursor:pointer;font-family:Inter,sans-serif;width:100%;height:100%;"><input type="checkbox" style="width:15px;height:15px;accent-color:#16a34a;flex-shrink:0">${c.props.content||'Checkbox'}</label>`
      },
      toggle: {
        n: 'Toggle', d: 'On/off switch', dw: 80, dh: 30, txt: false,
        r: c => `<label style="display:flex;align-items:center;gap:8px;cursor:pointer;width:100%;height:100%;"><span style="width:42px;height:22px;background:${gs(c,'backgroundColor','#16a34a')};border-radius:11px;position:relative;display:inline-block;flex-shrink:0"><span style="position:absolute;width:16px;height:16px;background:#fff;border-radius:50%;top:3px;right:3px;"></span></span></label>`
      },
      datepicker: {
        n: 'DatePicker', d: 'Date input', dw: 200, dh: 44, txt: false,
        r: c => `<input type="date" style="width:100%;height:100%;border:1px solid ${gs(c,'borderColor','#ddd')};border-radius:${gs(c,'borderRadius','8px')};padding:0 12px;font-size:14px;font-family:Inter,sans-serif;background:${gs(c,'backgroundColor','#fff')};color:#333;outline:none;box-sizing:border-box;">`
      },

      // ══ MEDIA ════════════════════════════════════════════════
      image: {
        n: 'Image', d: 'Image or media element', dw: 240, dh: 160, txt: false, img: true,
        r: c => {
          const br = gs(c,'borderRadius','8px');
          if (c.props.src) return `<img src="${c.props.src}" style="width:100%;height:100%;object-fit:${c.props.fit||'cover'};object-position:${c.props.position||'center'};border-radius:${br};display:block;" onerror="this.style.display='none'">`;
          return `<div style="width:100%;height:100%;background:linear-gradient(135deg,#e8eaf6,#c5cae9);border-radius:${br};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px"><span style="font-size:30px">🖼</span><span style="font-size:11px;color:#7986cb;font-family:Inter,sans-serif">Click image or use URL →</span></div>`;
        }
      },
      icon: {
        n: 'Icon', d: 'SVG icon / emoji', dw: 44, dh: 44, txt: false,
        r: c => `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:${Math.round(Math.min(c.w,c.h)*.55)}px;color:${gs(c,'color','#16a34a')}">${c.props.icon||'★'}</div>`
      },

      // ══ NAVIGATION ═══════════════════════════════════════════
      navbar: {
        n: 'Navbar', d: 'Top navigation bar', dw: 1200, dh: 64, txt: false,
        r: c => `<nav style="width:100%;height:100%;background:${gs(c,'backgroundColor','#fff')};border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 24px;gap:28px;font-family:Inter,sans-serif;overflow:hidden;box-sizing:border-box;"><span style="font-weight:700;font-size:17px;color:#111;flex-shrink:0">Logo</span><a style="font-size:13px;color:#555;text-decoration:none;flex-shrink:0">Home</a><a style="font-size:13px;color:#555;text-decoration:none;flex-shrink:0">About</a><a style="font-size:13px;color:#555;text-decoration:none;flex-shrink:0">Projects</a><div style="margin-left:auto;display:flex;gap:8px;flex-shrink:0"><span style="background:#16a34a;color:#fff;padding:7px 16px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer">Sign up</span></div></nav>`
      },
      sidebar: {
        n: 'Sidebar', d: 'Vertical navigation', dw: 200, dh: 360, txt: false,
        r: c => `<aside style="width:100%;height:100%;background:${gs(c,'backgroundColor','#fff')};border-right:1px solid #eee;padding:14px;font-family:Inter,sans-serif;overflow:hidden;box-sizing:border-box;"><div style="font-weight:700;font-size:12px;color:#333;margin-bottom:14px;padding-left:4px">MENU</div>${['🏠 Dashboard','📁 Projects','⚙ Settings','👤 Profile'].map((i,n)=>`<div style="padding:8px 10px;border-radius:6px;font-size:12px;color:${n===0?'#16a34a':'#555'};background:${n===0?'rgba(22,163,74,.08)':'transparent'};cursor:pointer;margin-bottom:2px">${i}</div>`).join('')}</aside>`
      },
      tabs: {
        n: 'Tabs', d: 'Tab switcher', dw: 380, dh: 44, txt: false,
        r: c => `<div style="font-family:Inter,sans-serif;background:${gs(c,'backgroundColor','#fff')};width:100%;height:100%;overflow:hidden;border-bottom:2px solid #eee;display:flex;"><div style="display:flex;">${['Overview','Details','Activity'].map((t,i)=>`<span style="padding:0 18px;height:100%;display:flex;align-items:center;font-size:13px;font-weight:${i===0?600:400};color:${i===0?'#16a34a':'#999'};border-bottom:${i===0?'2px solid #16a34a':'2px solid transparent'};margin-bottom:-2px;cursor:pointer">${t}</span>`).join('')}</div></div>`
      },

      // ══ FEEDBACK ═════════════════════════════════════════════
      badge: {
        n: 'Badge', d: 'Status chip / tag', dw: 80, dh: 26, txt: true,
        r: c => `<span style="display:inline-flex;align-items:center;justify-content:center;padding:2px 10px;border-radius:20px;font-size:${gs(c,'fontSize','11px')};font-weight:600;font-family:Inter,sans-serif;background:${gs(c,'backgroundColor','rgba(22,163,74,.12)')};color:${gs(c,'color','#16a34a')};border:1px solid ${gs(c,'borderColor','rgba(22,163,74,.3)')};width:100%;height:100%;box-sizing:border-box;">${c.props.content||'Active'}</span>`
      },
      alert: {
        n: 'Alert', d: 'Status alert banner', dw: 340, dh: 56, txt: true,
        r: c => `<div style="width:100%;height:100%;background:${gs(c,'backgroundColor','#fffbeb')};border:1px solid ${gs(c,'borderColor','#fcd34d')};border-radius:${gs(c,'borderRadius','8px')};padding:0 14px;display:flex;align-items:center;gap:10px;font-family:Inter,sans-serif;box-sizing:border-box;"><span style="font-size:17px;flex-shrink:0">⚠️</span><span style="font-size:13px;color:${gs(c,'color','#92400e')};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.props.content||'Alert message here'}</span></div>`
      },
      progress: {
        n: 'Progress', d: 'Progress bar', dw: 220, dh: 32, txt: false,
        r: c => { const v=c.props.value||65; return `<div style="width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;gap:4px;box-sizing:border-box;"><div style="display:flex;justify-content:space-between;font-size:11px;color:#666;font-family:Inter,sans-serif;margin-bottom:2px"><span>Progress</span><span>${v}%</span></div><div style="width:100%;height:7px;background:#e5e7eb;border-radius:4px;overflow:hidden;"><div style="height:100%;width:${v}%;background:linear-gradient(90deg,${gs(c,'backgroundColor','#16a34a')},#22c55e);border-radius:4px;"></div></div></div>`; }
      },
      spinner: {
        n: 'Spinner', d: 'Loading indicator', dw: 44, dh: 44, txt: false,
        r: c => `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;"><div style="width:${Math.round(Math.min(c.w,c.h)*.65)}px;height:${Math.round(Math.min(c.w,c.h)*.65)}px;border:3px solid #e5e7eb;border-top-color:${gs(c,'color','#16a34a')};border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0;"></div></div>`
      },

      // ══ DATA ═════════════════════════════════════════════════
      table: {
        n: 'Table', d: 'Data table', dw: 460, dh: 190, txt: false,
        r: c => `<div style="width:100%;height:100%;overflow:auto;background:${gs(c,'backgroundColor','#fff')};border-radius:${gs(c,'borderRadius','8px')};"><table style="width:100%;border-collapse:collapse;font-family:Inter,sans-serif;font-size:12px;"><thead><tr style="background:#f9fafb">${['Name','Status','Role','Date'].map(h=>`<th style="padding:8px 12px;text-align:left;font-weight:600;color:#374151;border-bottom:1px solid #e5e7eb;white-space:nowrap">${h}</th>`).join('')}</tr></thead><tbody>${[['Alice M.','✅ Active','Admin','Jan 2025'],['Bob K.','⏸ Paused','Editor','Dec 2024'],['Carol R.','✅ Active','Viewer','Feb 2025']].map(row=>`<tr style="border-bottom:1px solid #f3f4f6">${row.map(c=>`<td style="padding:8px 12px;color:#6b7280">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`
      },
      divider: {
        n: 'Divider', d: 'Horizontal separator', dw: 280, dh: 16, txt: false,
        r: c => `<div style="width:100%;height:100%;display:flex;align-items:center"><div style="flex:1;height:1px;background:${gs(c,'backgroundColor','#e5e7eb')}"></div></div>`
      },

        };

    

    const CONTAINERS = new Set(['rectangle','circle']);

    function getComp(id) { for(const f of G.frames){ const c=f.comps.find(c=>c.id===id); if(c) return c; } return null; }
    function getCompFrame(id) { for(const f of G.frames){ if(f.comps.find(c=>c.id===id)) return f; } return null; }
    function pushH() {}
    function selComp(id) { return; }
    function toast(msg) { document.getElementById('TM').textContent=msg; const t=document.getElementById('TST'); t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }
    function updateStatus() {}
    function fitAll() {}

    // ═══════════════════════════════════════════════
    // PRESENT
    // ═══════════════════════════════════════════════
    function renderPresent() {
      const poc = document.getElementById('POC'); poc.innerHTML = '';
      G.frames.forEach(f => {
        const wrap = document.createElement('div'); wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:12px;flex-shrink:0;';
        const lbl = document.createElement('div'); lbl.style.cssText = 'color:rgba(255,255,255,.35);font-size:11px;font-family:DM Mono,monospace;'; lbl.textContent = f.name + ' — ' + f.w + '×' + f.h;
        const frame = document.createElement('div'); frame.style.cssText = `width:${f.w}px;height:${f.h}px;background:#fff;border-radius:${f.radius || '0px'};overflow:hidden;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.7);flex-shrink:0;`;
        f.comps.forEach(c => {
          if (c.visible === false) return;
          const def = REG[c.type]; const el = document.createElement('div');
          el.style.cssText = `position:absolute;left:${c.x}px;top:${c.y}px;width:${c.w}px;height:${c.h}px;transform:rotate(${c.rotation || 0}deg);opacity:${parseFloat(c.style.opacity) || 1};overflow:hidden;`;
          el.innerHTML = def ? def.r(c) : ''; frame.appendChild(el);
        });
        wrap.appendChild(lbl); wrap.appendChild(frame); poc.appendChild(wrap);
      });
    }

    

    function restoreSnap(framesData) {
      G.frames = framesData.map(fd => ({...fd, comps: fd.comps||[]}));
      renderPresent();
    }

    // ── MESSAGE LISTENER ──
    window.addEventListener('message', function(event) {
      var msg = event.data;
      if (!msg || !msg.type) return;
      if (msg.type === 'DESIGN_LOAD' && msg.canvasData) {
        try { restoreSnap(JSON.parse(msg.canvasData)); toast('Design loaded ✓'); }
        catch(e) { console.error(e); }
      }
    });

    setTimeout(function() {
      window.parent.postMessage({ type: 'DESIGN_READY' }, '*');
    }, 300);
  </script>
</body>
</html>
