<div class="call-page">

  <div *ngIf="error" class="call-error">
    <span style="font-size:48px;">📵</span>
    <p>{{ error }}</p>
    <button (click)="closeTab()">Close</button>
  </div>

  <!-- plain display:block — no Angular binding -->
  <div id="zego-call-container" style="display:block;"></div>

</div>
