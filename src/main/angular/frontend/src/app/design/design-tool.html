<div class="dt-shell">

  <!-- ── TOP BAR ── -->
  <div class="dt-topbar">

    <!-- Left: B Logo + Project name -->
    <div class="dt-left">
      <div class="dt-logo-wrap">
        <span class="dt-b">B</span>
      </div>
      <div class="dt-title-block">
        <span class="dt-brand">Brycen Hub</span>
        <span class="dt-project">{{ projectName }}</span>
      </div>
    </div>

    <!-- Center: Back button -->
    <div class="dt-center">
      <button class="dt-back-btn" (click)="goBack()">
        ← Back to {{ projectName }}
      </button>
    </div>

    <!-- Right: mode badge + Undo, Redo, Save (edit only) -->
    <div class="dt-right">
      <span class="dt-mode-badge" [class]="'dt-mode-' + designMode">
        <span *ngIf="designMode === 'edit'">✏ Edit</span>
        <span *ngIf="designMode === 'present'">▶ Present</span>
        <span *ngIf="designMode === 'view'">👁 View</span>
      </span>
      <ng-container *ngIf="designMode === 'edit'">
        <button class="dt-icon-btn" (click)="sendCmd('UNDO')" title="Undo">↩ Undo</button>
        <button class="dt-icon-btn" (click)="sendCmd('REDO')" title="Redo">↪ Redo</button>
        <button class="dt-save-btn"
          [class.saving]="saveStatus === 'saving'"
          [class.saved]="saveStatus === 'saved'"
          (click)="sendCmd('SAVE')"
          [disabled]="saveStatus === 'saving'">
          <span *ngIf="saveStatus === 'idle'">💾 Save</span>
          <span *ngIf="saveStatus === 'saving'">Saving...</span>
          <span *ngIf="saveStatus === 'saved'">✓ Saved</span>
        </button>
      </ng-container>
    </div>

  </div>

  <!-- ── IFRAME BODY ── -->
  <div class="dt-body">

    <!-- Loading -->
    <div class="dt-loading" *ngIf="loading">
      <div class="dt-spinner"></div>
      <p>Loading design...</p>
    </div>

    <!-- iframe -->
    <iframe
      #designIframe
      [src]="iframeSrc"
      class="dt-iframe"
      [style.visibility]="loading ? 'hidden' : 'visible'"
      (load)="onIframeLoad()"
      allow="clipboard-read; clipboard-write">
    </iframe>

  </div>

</div>
