<div class="chat-popup-wrap" [class.minimized]="isMinimized">

  <!-- Header -->
  <div class="cp-header" (click)="isMinimized && toggleMinimize()">

    <!-- Avatar -->
    <div class="cp-avatar" [style.background]="member.color || '#16a34a'">
      <span *ngIf="!isGroup">{{ member.initial || member.name.charAt(0) }}</span>
      <span *ngIf="isGroup">👥</span>
      <div *ngIf="!isGroup && member.online" class="cp-online-dot"></div>
    </div>

    <!-- Name + Status -->
    <div class="cp-header-info">
      <div class="cp-name">{{ popupTitle }}</div>
      <div class="cp-status" *ngIf="!isGroup">
        <span [style.color]="member.online ? '#22c55e' : '#64748b'">
          {{ member.online ? '● Online' : '○ Offline' }}
        </span>
      </div>
      <div class="cp-status" *ngIf="isGroup">
        <span style="color:#64748b">Project Group</span>
      </div>
    </div>

    <!-- Header Actions -->
    <div class="cp-header-actions">
      <!-- Voice Call -->
      <button class="cp-icon-btn cp-voice-btn"
        *ngIf="!isInCall"
        (click)="startCall('voice'); $event.stopPropagation()"
        title="Voice Call">
        📞
      </button>
      <!-- Video Call -->
      <button class="cp-icon-btn cp-video-btn"
        *ngIf="!isInCall"
        (click)="startCall('video'); $event.stopPropagation()"
        title="Video Call">
        📹
      </button>
      <!-- End Call -->
      <button class="cp-icon-btn cp-end-btn"
        *ngIf="isInCall"
        (click)="endCall(); $event.stopPropagation()"
        title="End Call">
        📵
      </button>
      <!-- Minimize -->
      <button class="cp-icon-btn"
        (click)="toggleMinimize(); $event.stopPropagation()"
        title="Minimize">
        {{ isMinimized ? '▲' : '▼' }}
      </button>
      <!-- Close -->
      <button class="cp-icon-btn cp-close-btn"
        (click)="closePopup(); $event.stopPropagation()"
        title="Close">
        ✕
      </button>
    </div>
  </div>

  <!-- Body (hidden when minimized) -->
  <div class="cp-body" *ngIf="!isMinimized">

    <!-- Call Container -->
    <div class="cp-call-container" *ngIf="isInCall" #callContainer></div>

    <!-- Chat Area -->
    <div class="cp-chat-area" *ngIf="!isInCall">

      <!-- Messages -->
      <div class="cp-messages" #messagesContainer>
        <div *ngIf="messages.length === 0" class="cp-empty">
          <p>👋 Say hello to {{ isGroup ? 'the team' : member.name }}!</p>
        </div>
        <div *ngFor="let msg of messages"
          class="cp-msg-wrap"
          [class.mine]="msg.isMine">
          <!-- Avatar (others only) -->
          <div *ngIf="!msg.isMine" class="cp-msg-avatar"
            [style.background]="member.color || '#16a34a'">
            {{ msg.senderName.charAt(0) }}
          </div>
          <div class="cp-msg-bubble-wrap">
            <!-- Sender name (group only) -->
            <div *ngIf="isGroup && !msg.isMine" class="cp-msg-sender">
              {{ msg.senderName }}
            </div>
            <div class="cp-msg-bubble">{{ msg.content }}</div>
            <div class="cp-msg-time">{{ msg.time }}</div>
          </div>
        </div>
      </div>

      <!-- Input -->
      <div class="cp-input-area">
        <input
          class="cp-input"
          type="text"
          [(ngModel)]="newMessage"
          (keypress)="onKeyPress($event)"
          placeholder="Type a message..."
          autocomplete="off">
        <button class="cp-send-btn"
          (click)="sendMessage()"
          [disabled]="!newMessage.trim()">
          ➤
        </button>
      </div>

    </div>
  </div>

</div>
