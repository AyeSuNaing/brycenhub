<div style="display:flex;flex-direction:column;height:100%;min-height:0;">

  <!-- ══ Header + Date Filter ══ -->
  <div style="padding:14px 16px 10px;flex-shrink:0;">

    <!-- Title row -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:14px;font-weight:700;">📢 Announcements</span>
        <span style="font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;"
              [style.background]="isDark?'rgba(100,116,139,0.15)':'#f1f5f9'"
              [style.color]="isDark?'#94a3b8':'#64748b'">
          {{ totalItems }} total
        </span>
      </div>
      <button (click)="resetToToday()"
              style="font-size:10px;padding:4px 10px;border-radius:7px;cursor:pointer;
                     border:1px solid;font-family:inherit;background:transparent;opacity:0.6;"
              [style.borderColor]="isDark?'#1e2d4a':'#e2e8f0'"
              [style.color]="isDark?'#94a3b8':'#64748b'">
        Today
      </button>
    </div>

    <!-- Date range inputs -->
    <div style="display:flex;align-items:flex-end;gap:8px;">
      <div style="flex:1;">
        <div style="font-size:9px;font-weight:700;text-transform:uppercase;
                    letter-spacing:0.8px;opacity:0.45;margin-bottom:4px;">From</div>
        <input type="date"
               [(ngModel)]="fromDate"
               class="date-input"
               style="width:100%;font-size:11px;padding:7px 10px;border-radius:8px;
                      border:1px solid;box-sizing:border-box;font-family:inherit;"
               [style.background]="isDark?'#0d1424':'white'"
               [style.borderColor]="isDark?'#1e2d4a':'#e2e8f0'"
               [style.color]="isDark?'#e2e8f0':'#1e293b'"/>
      </div>

      <div style="opacity:0.4;font-size:12px;padding-bottom:8px;">→</div>

      <div style="flex:1;">
        <div style="font-size:9px;font-weight:700;text-transform:uppercase;
                    letter-spacing:0.8px;opacity:0.45;margin-bottom:4px;">To</div>
        <input type="date"
               [(ngModel)]="toDate"
               class="date-input"
               style="width:100%;font-size:11px;padding:7px 10px;border-radius:8px;
                      border:1px solid;box-sizing:border-box;font-family:inherit;"
               [style.background]="isDark?'#0d1424':'white'"
               [style.borderColor]="isDark?'#1e2d4a':'#e2e8f0'"
               [style.color]="isDark?'#e2e8f0':'#1e293b'"/>
      </div>

      <button (click)="applyFilter()"
              style="padding:7px 14px;border-radius:8px;border:none;
                     background:linear-gradient(135deg,#14532d,#16a34a);
                     color:white;font-size:11px;font-weight:700;
                     cursor:pointer;font-family:inherit;white-space:nowrap;">
        Search
      </button>
    </div>
  </div>

  <!-- Divider -->
  <div style="height:1px;flex-shrink:0;"
       [style.background]="isDark?'#1e2d4a':'#e2e8f0'"></div>

  <!-- ══ List ══ -->
  <div style="flex:1;overflow-y:auto;padding:10px 16px;">

    <!-- Skeleton loading -->
    <ng-container *ngIf="loading && items.length===0">
      <div *ngFor="let i of [1,2,3,4,5]"
           style="border-radius:10px;padding:14px 16px;margin-bottom:8px;"
           [style.background]="isDark?'#131929':'#f1f5f9'">
        <div style="height:8px;border-radius:4px;width:28%;margin-bottom:8px;opacity:0.4;"
             [style.background]="isDark?'#1e2d4a':'#cbd5e1'"></div>
        <div style="height:12px;border-radius:4px;width:65%;margin-bottom:7px;opacity:0.4;"
             [style.background]="isDark?'#1e2d4a':'#cbd5e1'"></div>
        <div style="height:9px;border-radius:4px;width:88%;opacity:0.3;"
             [style.background]="isDark?'#1e2d4a':'#cbd5e1'"></div>
      </div>
    </ng-container>

    <!-- Announcement cards -->
    <div *ngFor="let a of items"
         style="border-radius:10px;border:1px solid;padding:14px 16px;margin-bottom:8px;"
         [style.borderColor]="isDark?'#1e2d4a':'#e2e8f0'"
         [style.background]="isDark?'#0d1424':'white'"
         [style.opacity]="a.priority==='EXPIRED'?'0.6':'1'">

      <!-- Badges row -->
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:7px;flex-wrap:wrap;">
        <span style="font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px;"
              [style.background]="a.tagColor+'22'"
              [style.color]="a.tagColor">
          {{ a.tag }}
        </span>
        <span *ngIf="a.priority==='IMPORTANT'"
              style="font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;
                     background:rgba(249,115,22,0.15);color:#f97316;">
          IMPORTANT
        </span>
        <span *ngIf="a.priority==='URGENT'"
              style="font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;
                     background:rgba(239,68,68,0.15);color:#ef4444;">
          URGENT
        </span>
        <span *ngIf="a.priority==='EXPIRED'"
              style="font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;
                     background:rgba(100,116,139,0.2);color:#64748b;">
          EXPIRED
        </span>
        <span style="margin-left:auto;font-size:9px;opacity:0.4;">{{ a.time }}</span>
      </div>

      <!-- Title -->
      <div style="font-size:12px;font-weight:700;margin-bottom:5px;line-height:1.4;">
        {{ a.title }}
      </div>

      <!-- Body -->
      <div style="font-size:11px;opacity:0.7;line-height:1.6;">{{ a.text }}</div>

      <!-- Author -->
      <div style="font-size:9px;opacity:0.4;margin-top:7px;">{{ a.meta }}</div>
    </div>

    <!-- Empty state -->
    <div *ngIf="!loading && items.length===0"
         style="text-align:center;padding:48px 0;">
      <div style="font-size:36px;margin-bottom:10px;">📭</div>
      <div style="font-size:12px;opacity:0.4;margin-bottom:12px;">
        No announcements for this date range
      </div>
      <button (click)="resetToToday()"
              style="font-size:11px;padding:6px 16px;border-radius:8px;
                     border:1px solid rgba(22,163,74,0.3);background:transparent;
                     color:#22c55e;cursor:pointer;font-family:inherit;">
        View Today
      </button>
    </div>

    <!-- Load more -->
    <div *ngIf="hasNext" style="text-align:center;padding:12px 0 4px;">
      <button (click)="loadMore()"
              [disabled]="loading"
              style="font-size:11px;padding:7px 20px;border-radius:8px;border:1px solid;
                     background:transparent;cursor:pointer;font-family:inherit;font-weight:600;"
              [style.borderColor]="isDark?'#1e2d4a':'#e2e8f0'"
              [style.color]="isDark?'#94a3b8':'#64748b'"
              [style.opacity]="loading?'0.4':'1'">
        {{ loading ? 'Loading...' : 'Load More ↓' }}
      </button>
      <div style="font-size:9px;opacity:0.35;margin-top:5px;">
        {{ items.length }} / {{ totalItems }}
      </div>
    </div>

    <!-- Loading more indicator -->
    <div *ngIf="loading && items.length > 0"
         style="text-align:center;padding:12px;font-size:11px;opacity:0.4;">
      Loading...
    </div>

  </div>
</div>
